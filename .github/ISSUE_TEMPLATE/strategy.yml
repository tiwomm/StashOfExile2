name: Money Makers strat
description: Share a farming strat for the Money Makers window (same layout as strats/README.md).
title: "[Strat] "
labels: ["strat"]
body:
  - type: markdown
    attributes:
      value: "Fill in what you know - or attach the .txt from the app's Download Format - leave a box empty if you don't. A maintainer turns it into a file in `strats/`; once merged, every app gets it within 12 hours."
  - type: input
    id: name
    attributes: {label: Name}
    validations: {required: true}
  - type: dropdown
    id: type
    attributes:
      label: Category › Type (the main thing you farm or do)
      options: ["Mapping › Breach", "Mapping › Delirium", "Mapping › Ritual", "Mapping › Expedition", "Mapping › Abyss", "Mapping › Essence", "Mapping › Strongbox", "Mapping › Rogue Exiles", "Mapping › Shrines", "Mapping › Overseer", "Mapping › Temple", "Mapping › Juiced mapping", "Mapping › Alch & go", "Bossing › Pinnacle bosses", "Bossing › Map bosses", "Bossing › Simulacrum", "Bossing › Trial of the Sekhemas", "Bossing › Trial of Chaos", "Crafting › Tablet crafting", "Crafting › Waystone crafting", "Crafting › Gear crafting", "Crafting › Jewel crafting", "Crafting › Flask & charm crafting", "Trading › Currency flipping", "Trading › Bulk selling", "Trading › Buy low, sell high", "Trading › Services", "Other › Vendor recipes", "Other › Gold", "Other › Other"]
    validations: {required: true}
  - type: input
    id: summary
    attributes: {label: Summary, description: "One line: what you do and where the money comes from."}
    validations: {required: true}
  - type: input
    id: patch
    attributes: {label: Game version, placeholder: "0.4"}
    validations: {required: true}
  - type: dropdown
    id: thoughts
    attributes:
      label: Thinking
      options: ["Autopilot", "Easy", "Moderate", "Hard", "Big brain"]
    validations: {required: true}
  - type: dropdown
    id: clicks
    attributes:
      label: Clicks per hour
      options: ["Chill", "Steady", "Busy", "Frantic"]
    validations: {required: true}
  - type: input
    id: tags
    attributes: {label: Tags, description: "Also uses: Abyss, Breach, Delirium, Ritual, Expedition, Essence, Strongbox, Rogue Exiles, Shrines, Overseer, Temple; Farm type: City area farm, Sacred Bloom farm, Juiced maps, Low-tier maps, Campaign zones; Budget: League start, Low budget, Mid budget, High budget; Play style: SSF friendly, Trade league, Party play, Hardcore safe"}
  - type: input
    id: tiers
    attributes: {label: Waystone tiers (1-16), placeholder: "T14-16"}
  - type: input
    id: profit
    attributes: {label: Est. profit per hour, placeholder: "5-10 div"}
  - type: input
    id: investment
    attributes: {label: Est. cost, placeholder: "20 div"}
  - type: textarea
    id: requirements
    attributes: {label: Requirements (one per line)}
  - type: textarea
    id: tablets
    attributes: {label: Tablets (one per line)}
  - type: textarea
    id: waystones
    attributes: {label: Waystones (one per line)}
  - type: textarea
    id: atlas
    attributes: {label: Atlas / master setup (one per line)}
  - type: textarea
    id: craft_steps
    attributes: {label: Craft steps (one per line)}
  - type: textarea
    id: setup
    attributes: {label: Other setup (one per line)}
  - type: textarea
    id: steps
    attributes: {label: Steps (one per line, in order)}
    validations: {required: true}
  - type: textarea
    id: loot
    attributes: {label: Loot to sell (item names, one per line)}
  - type: textarea
    id: tips
    attributes: {label: Tips (one per line)}
  - type: textarea
    id: risks
    attributes: {label: Risks (one per line)}
  - type: input
    id: regex
    attributes: {label: Stash regex}
  - type: textarea
    id: sources
    attributes: {label: Sources (links, one per line)}
  - type: textarea
    id: json
    attributes: {label: "JSON (filled in by the app's Share button - leave as is)"}
