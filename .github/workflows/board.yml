name: Deploy community board
# The Money Makers Community board (board/): a Cloudflare Worker + D1 database. Runs when board/ changes on main, or
# by hand (Actions > Deploy community board > Run workflow). Needs the repo secrets listed in board/README.md;
# without them it skips quietly.
on:
  push:
    branches: [main]
    paths: ["board/**", ".github/workflows/board.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ secrets.D1_ID }}
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@v4
      - name: Secrets set?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_ID" ]; then
            echo "Board secrets aren't set yet - see board/README.md. Skipping."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with: {node-version: "22"}
      - name: Install wrangler
        if: steps.ready.outputs.go == 'yes'
        run: npm ci --no-audit --no-fund
      - name: Point at your database
        if: steps.ready.outputs.go == 'yes'
        run: sed -i "s/REPLACE_WITH_YOUR_D1_ID/$D1_ID/" wrangler.toml
      - name: Create / update the tables
        if: steps.ready.outputs.go == 'yes'
        run: npx wrangler d1 execute soe2-board --remote --file schema.sql
      - name: Deploy the Worker
        if: steps.ready.outputs.go == 'yes'
        run: npx wrangler deploy
      - name: Discord + admin secrets
        if: steps.ready.outputs.go == 'yes'
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          printf '%s' "$DISCORD_CLIENT_ID" | npx wrangler secret put DISCORD_CLIENT_ID
          printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
          printf '%s' "$ADMIN_IDS" | npx wrangler secret put ADMIN_IDS
