# Quick checks on every pull request (2.34.0): the version agrees everywhere, the code stays on the design tokens,
# and every theme / accent keeps WCAG AA text contrast. Each is one script in tools/ - run them yourself the same way.
name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version agrees everywhere
        run: python tools/check_version.py
      - name: Design tokens (text sizes, spacing)
        run: python tools/check_tokens.py
      - name: Contrast (WCAG AA, every theme and accent)
        run: python tools/check_contrast.py
      - name: Windows text reader (OCR) for the Expedition Remnant Price Checker
        continue-on-error: true            # the runner may lack an OCR language; this only shows what it reads
        run: |
          python -m pip install --quiet pillow winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Globalization winrt-Windows.Graphics.Imaging winrt-Windows.Media.Ocr winrt-Windows.Storage.Streams
          python -c "from soe2 import remnant; print('OCR read:', remnant.selftest())"
