# Quick checks on every pull request (2.34.0): the GGG ToS safety check (2.38.0, TOS.md), the version agrees everywhere, the code stays on the design tokens,
# every colour follows the theme (2.111.0), every theme / accent keeps WCAG AA text contrast, and the code has no
# undefined names or broken code (2.115.0, ruff). Each is one script in tools/ - run them yourself the same way.
name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: GGG ToS safety check (TOS.md)
        run: python tools/check_tos.py
      - name: Version agrees everywhere
        run: python tools/check_version.py
      - name: Design tokens (text sizes, spacing)
        run: python tools/check_tokens.py
      - name: Every colour follows the theme
        run: python tools/check_theme.py
      - name: Contrast (WCAG AA, every theme and accent)
        run: python tools/check_contrast.py
      - name: Code check (ruff - names that don't exist, broken code; 2.115.0)
        run: |
          python -m pip install --quiet ruff==0.16.9
          python -m ruff check --select F,E9 --ignore F401,F841,F811,F402 soe2 stashofexile2.py tools
      - name: Windows text reader (OCR) for the Expedition Remnant Price Checker
        continue-on-error: true            # the runner may lack an OCR language; this only shows what it reads
        run: |
          python -m pip install --quiet pillow winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Globalization winrt-Windows.Graphics.Imaging winrt-Windows.Media.Ocr winrt-Windows.Storage.Streams
          python -c "from soe2 import remnant; print('OCR read:', remnant.selftest())"
