name: Check strats
on:
  pull_request:
    paths: ["strats/**", "moneymakers.json", "soe2/moneymakers.py", "tools/build_strats.py", "board/**"]
  push:
    branches: [main]
    paths: ["strats/**", "moneymakers.json"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Every strat follows the layout
        run: python tools/build_strats.py --check
      - name: moneymakers.json is up to date
        run: |
          python tools/build_strats.py
          git diff --exit-code moneymakers.json board/src/schema.json || (echo "Run: py tools/build_strats.py and commit moneymakers.json + board/src/schema.json" && exit 1)
