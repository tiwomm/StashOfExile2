# Builds StashOfExile2.exe on GitHub's own Windows machine and publishes a release (same steps as build_exe.bat).
# Runs when main gets a new version: the version in stashofexile2.py (APP_VERSION) that has no "v<version>" tag yet.
# It makes that tag, builds the exe and publishes the release; the app's "Check for updates" finds it there.
# Nothing happens for changes that don't change the version. Also runs by hand (Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: ["stashofexile2.py", "soe2/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version, and stop if it's already released
        id: ver
        shell: bash
        run: |
          APP=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('stashofexile2.py', encoding='utf-8').read()).group(1))")
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('soe2/__init__.py', encoding='utf-8').read()).group(1))")
          echo "launcher $APP, soe2 $PKG"
          if [ "$APP" != "$PKG" ]; then echo "::error::APP_VERSION $APP and __version__ $PKG differ"; exit 1; fi
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$APP" >/dev/null; then
            echo "v$APP is already released - nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$APP" >> "$GITHUB_OUTPUT"

      - name: Install the build tools
        if: steps.ver.outputs.skip == 'false'
        run: python -m pip install --upgrade requests pystray pillow pyinstaller mss numpy opencv-python-headless

      - name: Build StashOfExile2.exe
        if: steps.ver.outputs.skip == 'false'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StashOfExile2 --icon stashofexile2.ico
          --collect-submodules soe2
          --add-data "tabs.txt;." --add-data "jewels.txt;." --add-data "gamedata.json;." --add-data "regexdata.json;."
          --add-data "default_rules.json;." --add-data "searchdata.json;." --add-data "stashofexile2.ico;."
          --add-data "soe2\templates;soe2\templates" --add-data "soe2\ritual_glyphs.json;soe2" --hidden-import pystray._win32 --hidden-import PIL._tkinter_finder
          --hidden-import cv2 --hidden-import mss --hidden-import numpy stashofexile2.py

      - name: Make the build kit zip and the release notes
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          git archive --format=zip -o "StashOfExile2_build_kit_$V.zip" HEAD
          python tools/check_version.py
          python tools/release_notes.py "$V" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: StashOfExile2 v${{ steps.ver.outputs.version }}
          body_path: notes.md
          make_latest: ${{ !contains(steps.ver.outputs.version, '-') }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            dist/StashOfExile2.exe
            StashOfExile2_build_kit_*.zip
