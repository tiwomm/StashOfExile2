# One-off: removes the old releases and tags from before the source was on main (they all point at the placeholder
# commit "Create 1.29"). Run it by hand once, after the v2.5.0 release exists: Actions > Clean up old releases > Run.
# It refuses to run until a v2.5.0 (or newer) release is there, so users always have an update to find.
name: Clean up old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Make sure the new release is there first
        run: gh release view v2.5.0 >/dev/null

      - name: Delete the old releases and their tags
        run: |
          for t in poe2 v1.32 v2.0.0; do
            gh release delete "$t" --yes --cleanup-tag && echo "deleted release $t" || echo "no release $t"
          done

      - name: Delete the remaining old tags
        run: |
          for t in v1.30 v2b14 v2.0b15 v2.0b16 2.0b17 v1.32 v2.0.0 poe2; do
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" >/dev/null 2>&1 && echo "deleted tag $t" || echo "no tag $t"
          done
