# StashOfExile2 window rules for Hyprland (classic .conf). UNTESTED groundwork - see linux/README.md.
# The main window's class is "Stashofexile2" (Tk capitalises tk.Tk(className="StashOfExile2")).
windowrulev2 = float, class:^(Stashofexile2)$
windowrulev2 = center, class:^(Stashofexile2)$
windowrulev2 = size 1400 1000, class:^(Stashofexile2)$
# Its own pop-up windows (borderless Tk toplevels under XWayland)
windowrulev2 = float, class:^(Toplevel)$, xwayland:1
# Ctrl+Alt+C goes to the game AND tells the app (pass-through bind; the app's socket listener is not written yet)
# bindn = CTRL ALT, C, exec, sh -c 'printf copy | socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/stashofexile2.sock'
